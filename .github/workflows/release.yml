name: Release

# Publishing a release: push a tag —
#   git tag v1.0.0 && git push origin v1.0.0
# GitHub builds the exe in the cloud and attaches it to a Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build exe & publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller AIQuickChat.spec --noconfirm

      - name: Create GitHub Release with the exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AIQuickChat.exe
          generate_release_notes: true
          draft: false
          prerelease: false
