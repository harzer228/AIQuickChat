# Tool configuration for the AIQuickChat desktop application.
# NOTE: this is an application, not a distributable library — there is
# intentionally no [build-system]/[project] packaging section. Build with
# PyInstaller (AIQuickChat.spec).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
# Make project packages (api/, ui/, utils/...) importable regardless of how
# pytest is invoked (direct executable vs `python -m pytest`).
pythonpath = ["."]

[tool.coverage.run]
source = ["api", "ui", "utils", "stt", "local_websearch"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "except Exception:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "Vosk"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # long lines allowed (rich QSS strings / docstrings)
    "UP015", # explicit open() modes are fine
]

[tool.ruff.lint.per-file-ignores]
# Qt GUI code uses lambdas for signal wiring by design
"ui/*" = ["E731"]

[tool.ruff.lint.isort]
# Explicit first-party classification: without it ruff guesses from folder
# names, and on Windows a local Vosk/ model folder makes it treat the
# third-party `import vosk` as first-party (case-insensitive match),
# demanding a different import layout than on CI.
known-first-party = [
    "api", "ui", "utils", "stt", "local_websearch", "config", "main",
]
# ...and pin the speech stack to third-party so results are identical
# with or without a local Vosk model folder.
known-third-party = ["vosk", "sounddevice"]
